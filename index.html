<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: sans-serif; max-width: 380px; margin: 40px auto; background: #111; color: #fff; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; }
    button { background: #10b981; border: none; font-weight: bold; cursor: pointer; }
    .box { background: #1e293b; padding: 12px; border-radius: 6px; margin-top: 10px; font-size: 12px; word-break: break-all; display: none; }
  </style>
</head>
<body>
  <h3>Get Prepaid Visa Card</h3>
  <input id="custWallet" placeholder="Enter Your Wallet Address (0x...)" />
  <input id="email" type="email" placeholder="Your Email (Card delivered here)" />
  <select id="amt">
    <option value="25">$25 Prepaid Visa (+ $3 Fee = $28)</option>
    <option value="50" selected>$50 Prepaid Visa (+ $3 Fee = $53)</option>
    <option value="100">$100 Prepaid Visa (+ $3 Fee = $103)</option>
  </select>
  <button onclick="payAndGetCard()">Pay $3 Fee + Card & Get Visa</button>
  <small id="msg">Ready</small>
  <div id="out" class="box"></div>

  <script>
    const API_KEY = "YOUR_BITREFILL_API_KEY"; // From ://bitrefill.com
    const MY_FEE_WALLET = "0xYourWalletAddressFor3DollarFee";
    const FEE_USD = 3;

    async function payAndGetCard() {
      const from = custWallet.value.trim();
      if (!/^0x[a-fA-F0-9]{40}$/.test(from)) return alert("Enter a valid 0x wallet address.");
      if (!email.value) return alert("Enter your email to receive the card.");

      msg.innerText = "1/3 Creating Prepaid Visa invoice...";
      try {
        // 1. Call Card API to create the prepaid Visa invoice
        const res = await fetch("https://bitrefill.com", {
          method: "POST",
          headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({
            products: [{ product_id: "virtual-prepaid-visa-usa", value: Number(amt.value), quantity: 1 }],
            payment_method: "ethereum",
            delivery_email: email.value,
            auto_pay: false
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Card API Error");

        // Calculate exact wei amounts for Card + $3 Fee based on live invoice rate
        const cardEth = Number(data.payment.price);
        const feeEth = (cardEth / Number(amt.value)) * FEE_USD;
        const toWeiHex = eth => "0x" + BigInt(Math.ceil(eth * 1e18)).toString(16);

        // 2. Prompt customer's wallet (matching the 0x address they entered) to pay your $3 fee + card
        if (window.ethereum) {
          await window.ethereum.request({ method: "eth_requestAccounts" });
          msg.innerText = "2/3 Approve $3 fee payment in your wallet...";
          const feeTx = await window.ethereum.request({
            method: "eth_sendTransaction",
            params: [{ from, to: MY_FEE_WALLET, value: toWeiHex(feeEth) }]
          });

          msg.innerText = "3/3 Approve $" + amt.value + " card payment in your wallet...";
          const cardTx = await window.ethereum.request({
            method: "eth_sendTransaction",
            params: [{ from, to: data.payment.address, value: toWeiHex(cardEth) }]
          });

          out.style.display = "block";
          out.innerHTML = `<b>Paid!</b><br>Fee Tx: ${feeTx}<br>Card Tx: ${cardTx}<br><br>Your $${amt.value} Visa card is being emailed to <b>${email.value}</b>.`;
          msg.innerText = "Complete!";
        } else {
          // Fallback if no browser wallet extension is active: show exact transfer details
          out.style.display = "block";
          out.innerHTML = `
            <b>Send from ${from}:</b><br><br>
            1) <b>${feeEth.toFixed(6)} ETH ($3 Fee)</b> → ${MY_FEE_WALLET}<br><br>
            2) <b>${cardEth} ETH ($${amt.value} Card)</b> → ${data.payment.address}<br><br>
            Card emails to <b>${email.value}</b> automatically upon payment.
          `;
          msg.innerText = "Invoice ready—send both amounts above.";
        }
      } catch (e) {
        msg.innerText = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
