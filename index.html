<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: sans-serif; max-width: 380px; margin: 30px auto; background: #111; color: #fff; }
    input, select, button { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
    button { background: #ec4899; border: none; font-weight: bold; cursor: pointer; }
    .row { display: flex; gap: 4px; }
    #pop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); padding: 20px; align-items: center; justify-content: center; }
    .box { background: #222; padding: 15px; border-radius: 8px; max-width: 360px; word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <button style="background:#2563eb" onclick="gen()">Generate Wallet</button>
    <button style="background:#333" onclick="imp()">Import Wallet</button>
    <button style="background:#333" onclick="keys()">Keys</button>
  </div>
  <input id="addr" placeholder="Wallet Address (0x...)" readonly onclick="navigator.clipboard.writeText(this.value)" />
  <select id="tIn" onchange="bal()"></select>
  <select id="tOut" onchange="bal()"></select>
  <small id="b">Balances: -</small>
  <input id="amt" type="number" step="any" placeholder="Amount" />
  <button onclick="swap()">Swap (0.5% Fee)</button>
  <small id="msg">Ready</small>

  <div id="pop"><div class="box">
    <b>Address:</b><p id="pA"></p><b>12-Word Phrase:</b><p id="pP"></p><b>Private Key:</b><p id="pK"></p>
    <button onclick="pop.style.display='none'">Close</button>
  </div></div>

  <script src="./ethers.umd.min.js"></script>
  <script>
    const RPC = "https://publicnode.com", ROUTER = "0x3fC91A3afd70395Cd496C647d5a6CC9D4B2b7FAD", FEE_TO = "0x000000000000000000000000000000000000dEaD";
    const TOKENS = [["WPOL","0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"],["WETH","0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619"],["WBTC","0x1BFD67037B42Cf73acF2047067bd4F2C47D9BfD6"],["LINK","0x53E0bca35eC356BD5ddDFebbD1Fc0fD03FaBad39"],["AAVE","0xD6DF932A45C0f255f85145f286eA0b292B21C90B"],["UNI","0xb33EaAd8d922B1083446DC23f610c2567fB5180f"]];
    const ABI = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)", "function approve(address,uint256) returns (bool)"];
    let p = new ethers.JsonRpcProvider(RPC), w = null;

    tIn.innerHTML = tOut.innerHTML = TOKENS.map(t => `<option value="${t.at(1)}">${t.at(0)}</option>`).join("");
    tOut.selectedIndex = 1;

    function setW(wallet, phrase = "Imported via Key") {
      w = wallet.connect(p); addr.value = pA.innerText = w.address; pP.innerText = phrase; pK.innerText = w.privateKey;
      localStorage.setItem("k", w.privateKey); localStorage.setItem("p", phrase); bal();
    }
    if (localStorage.getItem("k")) setW(new ethers.Wallet(localStorage.getItem("k")), localStorage.getItem("p"));

    function gen() { const nw = ethers.Wallet.createRandom(); setW(nw, nw.mnemonic.phrase); pop.style.display = "flex"; }
    function keys() { w ? pop.style.display = "flex" : alert("Generate or import wallet first"); }
    function imp() {
      const s = prompt("Paste 12-word phrase or 0x private key:"); if (!s) return;
      try { s.trim().includes(" ") ? setW(ethers.Wallet.fromPhrase(s.trim()), s.trim()) : setW(new ethers.Wallet(s.trim())); } catch { alert("Invalid key/phrase"); }
    }
    async function bal() {
      if (!w) return;
      const [g, b1, d1, b2, d2] = await Promise.all([p.getBalance(w.address), new ethers.Contract(tIn.value, ABI, p).balanceOf(w.address), new ethers.Contract(tIn.value, ABI, p).decimals(), new ethers.Contract(tOut.value, ABI, p).balanceOf(w.address), new ethers.Contract(tOut.value, ABI, p).decimals()]);
      b.innerText = `POL: ${Number(ethers.formatEther(g)).toFixed(3)} | In: ${ethers.formatUnits(b1, d1)} | Out: ${ethers.formatUnits(b2, d2)}`;
    }
    async function swap() {
      if (!w) return alert("Generate or import wallet first");
      try {
        const c = new ethers.Contract(tIn.value, ABI, w), a = ethers.parseUnits(amt.value, await c.decimals());
        msg.innerText = "1/2 Approving..."; await (await c.approve(ROUTER, a)).wait();
        msg.innerText = "2/2 Swapping...";
        const path = ethers.solidityPacked(["address","uint24","address"], [tIn.value, 3000, tOut.value]), cd = ethers.AbiCoder.defaultAbiCoder();
        const tx = await new ethers.Contract(ROUTER, ["function execute(bytes,bytes[],uint256) payable"], w).execute("0x000604", [
          cd.encode(["address","uint256","uint256","bytes","bool"], ["0x0000000000000000000000000000000000000002", a, 0, path, true]),
          cd.encode(["address","address","uint256"], [tOut.value, FEE_TO, 50]), cd.encode(["address","address","uint256"], [tOut.value, w.address, 0])
        ], Math.floor(Date.now()/1000)+180);
        await tx.wait(); msg.innerText = "Done: " + tx.hash; bal();
      } catch (e) { msg.innerText = e.shortMessage || e.message; }
    }
  </script>
</body>
</html>
